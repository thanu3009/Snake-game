<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Snake Game</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #222;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .game-container {
        text-align: center;
        width: 95%;
        max-width: 500px;
    }

    h1 {
        margin-bottom: 15px;
        font-size: 32px;
    }

    .score-board {
        display: flex;
        justify-content: space-between;
        background: #333;
        padding: 12px 20px;
        border-radius: 10px 10px 0 0;
        font-size: 18px;
    }

    #gameCanvas {
        width: 100%;
        max-width: 500px;
        height: auto;
        background: #111;
        border: 3px solid #555;
        display: block;
    }

    button {
        margin-top: 15px;
        padding: 12px 25px;
        font-size: 17px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #28a745;
        color: white;
    }

    button:hover {
        background: #218838;
    }

    .controls {
        margin-top: 15px;
        display: grid;
        grid-template-columns: repeat(3, 60px);
        justify-content: center;
        gap: 8px;
    }

    .control-btn {
        margin: 0;
        padding: 12px;
        background: #444;
        font-size: 20px;
    }

    .control-btn:hover {
        background: #666;
    }

    .empty {
        visibility: hidden;
    }

    #message {
        margin-top: 12px;
        min-height: 25px;
        font-size: 17px;
        color: #ffd700;
    }

    .instructions {
        margin-top: 15px;
        font-size: 14px;
        color: #ccc;
        line-height: 1.6;
    }
</style>
</head>

<body>

<div class="game-container">

    <h1>🐍 Snake Game</h1>

    <div class="score-board">
        <span>Score: <b id="score">0</b></span>
        <span>High Score: <b id="highScore">0</b></span>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div id="message">
        Press Start Game to play!
    </div>

    <button id="startBtn" onclick="startGame()">Start Game</button>

    <!-- Mobile Controls -->
    <div class="controls">
        <button class="control-btn empty"></button>
        <button class="control-btn" onclick="changeDirection('UP')">⬆️</button>
        <button class="control-btn empty"></button>

        <button class="control-btn" onclick="changeDirection('LEFT')">⬅️</button>
        <button class="control-btn" onclick="changeDirection('DOWN')">⬇️</button>
        <button class="control-btn" onclick="changeDirection('RIGHT')">➡️</button>
    </div>

    <div class="instructions">
        <p>🎮 Use Arrow Keys or the buttons to move.</p>
        <p>🍎 Eat the food and grow the snake.</p>
        <p>💥 Don't hit the wall or yourself!</p>
    </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreDisplay = document.getElementById("score");
const highScoreDisplay = document.getElementById("highScore");
const message = document.getElementById("message");
const startBtn = document.getElementById("startBtn");

const box = 25;
const canvasSize = 500;

let snake;
let food;
let direction;
let nextDirection;
let score = 0;
let gameRunning = false;
let gameInterval;

let highScore = localStorage.getItem("snakeHighScore") || 0;
highScoreDisplay.textContent = highScore;


// Start Game
function startGame() {

    clearInterval(gameInterval);

    snake = [
        { x: 250, y: 250 },
        { x: 225, y: 250 },
        { x: 200, y: 250 }
    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";

    score = 0;
    scoreDisplay.textContent = score;

    food = createFood();

    gameRunning = true;

    message.textContent = "Game Started! 🐍";

    startBtn.textContent = "Restart Game";

    gameInterval = setInterval(gameLoop, 100);

}


// Game Loop
function gameLoop() {

    direction = nextDirection;

    let head = {
        x: snake[0].x,
        y: snake[0].y
    };


    // Move snake
    if (direction === "UP") {
        head.y -= box;
    }

    if (direction === "DOWN") {
        head.y += box;
    }

    if (direction === "LEFT") {
        head.x -= box;
    }

    if (direction === "RIGHT") {
        head.x += box;
    }


    // Check wall collision
    if (
        head.x < 0 ||
        head.x >= canvasSize ||
        head.y < 0 ||
        head.y >= canvasSize
    ) {
        gameOver();
        return;
    }


    // Check self collision
    for (let i = 0; i < snake.length; i++) {

        if (
            head.x === snake[i].x &&
            head.y === snake[i].y
        ) {
            gameOver();
            return;
        }
    }


    snake.unshift(head);


    // Check food
    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        scoreDisplay.textContent = score;

        if (score > highScore) {
            highScore = score;
            localStorage.setItem("snakeHighScore", highScore);
            highScoreDisplay.textContent = highScore;
        }

        food = createFood();

    } else {

        snake.pop();

    }


    drawGame();
}


// Draw Game
function drawGame() {

    // Background
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvasSize, canvasSize);


    // Draw grid
    ctx.strokeStyle = "#222";

    for (let i = 0; i < canvasSize; i += box) {

        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvasSize);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvasSize, i);
        ctx.stroke();
    }


    // Draw snake
    snake.forEach((part, index) => {

        if (index === 0) {
            ctx.fillStyle = "#00ff66";
        } else {
            ctx.fillStyle = "#00cc55";
        }

        ctx.fillRect(
            part.x + 2,
            part.y + 2,
            box - 4,
            box - 4
        );

    });


    // Draw eyes
    const head = snake[0];

    ctx.fillStyle = "white";

    if (direction === "RIGHT") {
        ctx.fillRect(head.x + 15, head.y + 5, 5, 5);
        ctx.fillRect(head.x + 15, head.y + 15, 5, 5);
    }

    if (direction === "LEFT") {
        ctx.fillRect(head.x + 5, head.y + 5, 5, 5);
        ctx.fillRect(head.x + 5, head.y + 15, 5, 5);
    }

    if (direction === "UP") {
        ctx.fillRect(head.x + 5, head.y + 5, 5, 5);
        ctx.fillRect(head.x + 15, head.y + 5, 5, 5);
    }

    if (direction === "DOWN") {
        ctx.fillRect(head.x + 5, head.y + 15, 5, 5);
        ctx.fillRect(head.x + 15, head.y + 15, 5, 5);
    }


    // Draw food
    ctx.fillStyle = "#ff3333";

    ctx.beginPath();

    ctx.arc(
        food.x + box / 2,
        food.y + box / 2,
        box / 2 - 2,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


// Create food
function createFood() {

    let newFood;

    do {

        newFood = {
            x: Math.floor(Math.random() * (canvasSize / box)) * box,
            y: Math.floor(Math.random() * (canvasSize / box)) * box
        };

    } while (
        snake &&
        snake.some(
            part =>
                part.x === newFood.x &&
                part.y === newFood.y
        )
    );

    return newFood;
}


// Change Direction
function changeDirection(newDirection) {

    if (!gameRunning) {
        return;
    }


    // Prevent snake from moving directly backwards
    if (
        newDirection === "UP" &&
        direction !== "DOWN"
    ) {
        nextDirection = "UP";
    }

    if (
        newDirection === "DOWN" &&
        direction !== "UP"
    ) {
        nextDirection = "DOWN";
    }

    if (
        newDirection === "LEFT" &&
        direction !== "RIGHT"
    ) {
        nextDirection = "LEFT";
    }

    if (
        newDirection === "RIGHT" &&
        direction !== "LEFT"
    ) {
        nextDirection = "RIGHT";
    }
}


// Keyboard Controls
document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp") {
        event.preventDefault();
        changeDirection("UP");
    }

    if (event.key === "ArrowDown") {
        event.preventDefault();
        changeDirection("DOWN");
    }

    if (event.key === "ArrowLeft") {
        event.preventDefault();
        changeDirection("LEFT");
    }

    if (event.key === "ArrowRight") {
        event.preventDefault();
        changeDirection("RIGHT");
    }

});


// Game Over
function gameOver() {

    gameRunning = false;

    clearInterval(gameInterval);

    message.textContent =
        "Game Over! 💥 Your Score: " + score;

    drawGame();

    // Game over text
    ctx.fillStyle = "white";
    ctx.font = "bold 40px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "GAME OVER",
        canvasSize / 2,
        canvasSize / 2
    );

    ctx.font = "20px Arial";

    ctx.fillText(
        "Click Restart Game to play again",
        canvasSize / 2,
        canvasSize / 2 + 40
    );
}

</script>

</body>
</html>
